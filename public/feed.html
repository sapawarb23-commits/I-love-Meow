<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed — I Love Meow</title>
<meta name="description" content="Scroll a warm, purr-filled feed of cat photos, stories, and Meowments from the I Love Meow community.">
<link rel="canonical" href="https://ilovemeow.app/feed.html">
<meta property="og:type" content="website">
<meta property="og:title" content="Feed — I Love Meow">
<meta property="og:description" content="Scroll a warm, purr-filled feed of cat photos, stories, and Meowments from the I Love Meow community.">
<meta property="og:url" content="https://ilovemeow.app/feed.html">
<meta property="og:image" content="https://ilovemeow.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Feed — I Love Meow">
<meta name="twitter:description" content="Scroll a warm, purr-filled feed of cat photos, stories, and Meowments from the I Love Meow community.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>(function(){var t=localStorage.getItem("ilm_theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();</script>
</head>
<body>
<div class="bg-blobs" id="bg-blobs"></div>
<div class="mobile-dock" id="mobile-dock"></div>
<div class="nav-shell"><nav class="app-nav" id="app-nav"></nav></div>

<div class="wrap page" style="padding-top:8px;">

  <div class="card lift composer">
    <div style="display:flex; align-items:center; gap:12px; margin-bottom:14px;">
      <div id="composer-avatar"></div>
      <div class="field" style="margin-bottom:0; flex:1;">
        <textarea id="caption" placeholder="What's your cat up to? Write a Meow..." maxlength="1000"></textarea>
      </div>
    </div>
    <div style="display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
      <select id="cat-select" style="flex:1; min-width:140px; padding:10px 12px; border-radius:14px; border:1.5px solid rgba(29,29,29,.12); background:var(--gray); font-family:'Inter';">
        <option value="">No cat tagged</option>
      </select>
    </div>
    <div class="composer-uploader-slot" style="margin-bottom:14px;"></div>
    <div id="composer-error"></div>
    <div style="display:flex; justify-content:flex-end;">
      <button id="post-btn" class="btn btn-primary">Post Meow 🐾</button>
    </div>
  </div>

  <div class="feed-header-row">
    <h2 class="cute" style="font-size:20px;">The Feed</h2>
    <span class="badge" id="feed-count-badge" style="display:none;"></span>
  </div>

  <div id="feed-skeleton">
    <div class="card skeleton-card"></div>
    <div class="card skeleton-card"></div>
    <div class="card skeleton-card"></div>
  </div>
  <div id="feed-list"></div>
  <div id="feed-empty"></div>
  <button id="load-more" class="btn btn-ghost btn-block" style="display:none;">Load more</button>
</div>

<script src="/app.js"></script>
<script>
  if (!Meow.requireAuth()) { throw new Error('redirecting'); }
  Meow.renderNav('feed');

  let oldestTimestamp = null;

  function meowCardHtml(m) {
    const catTag = m.cat_name ? ` · with <b>${Meow.escapeHtml(m.cat_name)}</b>` : '';
    return `
      <div class="card lift meow-card" data-id="${m.id}">
        <div class="meow-head">
          ${Meow.avatarHtml(m)}
          <div>
            <div class="meow-author">@${Meow.escapeHtml(m.author_username)}${catTag}</div>
            <div class="meow-meta">${Meow.timeAgo(m.created_at)}</div>
          </div>
          ${m.author_username === Meow.user.username ? `<button class="pill-btn delete-btn" style="margin-left:auto;">🗑️ Delete</button>` : ''}
        </div>
        ${m.caption ? `<div class="meow-caption">${Meow.escapeHtml(m.caption)}</div>` : ''}
        ${m.image_url ? `<img class="meow-image" src="${Meow.escapeHtml(m.image_url)}" alt="Photo shared in ${Meow.escapeHtml(m.author_username || 'this')}'s Meow" loading="lazy" tabindex="0" data-lightbox="${Meow.escapeHtml(m.image_url)}" onerror="this.style.display='none'">` : ''}
        <div class="meow-actions">
          ${Meow.reactionBarHtml(m.reactions)}
          <button class="pill-btn meowment-toggle">💬 Meowment <span class="mm-count">${m.meowmentCount}</span></button>
        </div>
        <div class="meowments-list" style="display:none;">
          <div class="meowments-items"></div>
          <form class="meowment-form">
            <input type="text" class="mm-input" placeholder="Write a Meowment... (@mention, or paste a GIF/image URL)" maxlength="500">
            <button type="button" class="btn btn-ghost gif-toggle-btn" title="Attach a GIF/image URL">🖼️</button>
            <button type="submit" class="btn btn-ghost">Send</button>
          </form>
          <input type="url" class="mm-gif-input" placeholder="GIF or image URL (optional)" style="display:none; margin-top:8px; width:100%; padding:8px 12px; border-radius:12px; border:1.5px solid rgba(29,29,29,.12); background:var(--gray); font-family:'Inter'; font-size:13px;">
        </div>
      </div>
    `;
  }

  // ---- Threaded comment rendering ----

  function commentMediaHtml(mm) {
    if (!mm.gif_url) return '';
    return `<img class="mm-gif" src="${Meow.escapeHtml(mm.gif_url)}" alt="GIF attached to reply" loading="lazy" style="max-width:220px; border-radius:12px; margin-top:6px; display:block;" onerror="this.style.display='none'">`;
  }

  function commentHtml(mm, meow, depth = 0) {
    const isAuthor = mm.author_id === Meow.user.id;
    const isMeowOwner = meow.author_id === Meow.user.id;
    const canDelete = !mm.deleted && (isAuthor || isMeowOwner);
    const canEdit = !mm.deleted && isAuthor;
    const canPin = !mm.deleted && depth === 0 && isMeowOwner;
    const bodyHtml = mm.deleted
      ? `<span style="opacity:.5; font-style:italic;">[deleted]</span>`
      : Meow.renderWithMentions(mm.body);
    return `
      <div class="meowment ${depth > 0 ? 'is-reply' : ''} ${mm.pinned ? 'is-pinned' : ''}" data-mm-id="${mm.id}" style="${depth > 0 ? 'margin-left:32px;' : ''}">
        ${Meow.avatarHtml(mm, { size: 26, className: 'flex-shrink' })}
        <div style="flex:1; min-width:0;">
          ${mm.pinned ? `<div class="badge" style="margin-bottom:4px;">📌 Pinned by post owner</div>` : ''}
          <div>
            <b>@${Meow.escapeHtml(mm.author_username)}</b>
            <span class="mm-body">${bodyHtml}</span>
            ${mm.edited_at && !mm.deleted ? '<span style="font-size:11px; opacity:.45;"> (edited)</span>' : ''}
          </div>
          ${commentMediaHtml(mm)}
          <div class="mm-actions" style="display:flex; gap:12px; margin-top:4px;">
            <span style="font-size:11.5px; opacity:.5;">${Meow.timeAgo(mm.created_at)}</span>
            ${!mm.deleted ? `<button class="mm-link reply-btn" data-id="${mm.id}">Reply</button>` : ''}
            ${canPin ? `<button class="mm-link pin-btn" data-id="${mm.id}">${mm.pinned ? 'Unpin' : 'Pin'}</button>` : ''}
            ${canEdit ? `<button class="mm-link edit-btn" data-id="${mm.id}">Edit</button>` : ''}
            ${canDelete ? `<button class="mm-link delete-mm-btn" data-id="${mm.id}">Delete</button>` : ''}
          </div>
          <div class="reply-form-slot" data-for="${mm.id}"></div>
          <div class="mm-replies">
            ${(mm.replies || []).map(r => commentHtml(r, meow, depth + 1)).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function replyFormHtml(parentId) {
    return `
      <form class="reply-form" data-parent="${parentId}" style="display:flex; gap:8px; margin-top:8px;">
        <input type="text" placeholder="Write a reply..." maxlength="500" style="flex:1;">
        <button type="submit" class="btn btn-ghost" style="padding:8px 14px;">Reply</button>
        <button type="button" class="btn btn-ghost cancel-reply" style="padding:8px 14px;" aria-label="Cancel reply">✕</button>
      </form>
    `;
  }

  function editFormHtml(mm) {
    return `
      <form class="edit-form" data-id="${mm.id}" style="display:flex; gap:8px; margin-top:6px;">
        <input type="text" value="${Meow.escapeHtml(mm.body).replace(/"/g, '&quot;')}" maxlength="500" style="flex:1;">
        <button type="submit" class="btn btn-ghost" style="padding:8px 14px;">Save</button>
        <button type="button" class="btn btn-ghost cancel-edit" style="padding:8px 14px;" aria-label="Cancel edit">✕</button>
      </form>
    `;
  }

  function attachThreadHandlers(container, meow, refreshFn) {
    container.querySelectorAll('.reply-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const slot = container.querySelector(`.reply-form-slot[data-for="${btn.dataset.id}"]`);
        if (slot.innerHTML) { slot.innerHTML = ''; return; }
        slot.innerHTML = replyFormHtml(btn.dataset.id);
        const form = slot.querySelector('.reply-form');
        form.querySelector('input').focus();
        form.querySelector('.cancel-reply').addEventListener('click', () => { slot.innerHTML = ''; });
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const input = form.querySelector('input');
          if (!input.value.trim()) return;
          try {
            await Meow.api(`/api/meows/${meow.id}/meowments`, {
              method: 'POST',
              body: { body: input.value, parent_id: btn.dataset.id },
            });
            slot.innerHTML = '';
            refreshFn();
          } catch (err) { Meow.toast(err.message); }
        });
      });
    });

    container.querySelectorAll('.pin-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        try {
          await Meow.api(`/api/meowments/${btn.dataset.id}/pin`, { method: 'POST' });
          refreshFn();
        } catch (err) { Meow.toast(err.message); }
      });
    });

    container.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const row = container.querySelector(`.meowment[data-mm-id="${btn.dataset.id}"]`);
        const bodyEl = row.querySelector('.mm-body');
        const existing = row.querySelector('.edit-form');
        if (existing) { existing.remove(); bodyEl.style.display = ''; return; }
        bodyEl.style.display = 'none';
        const holder = document.createElement('div');
        holder.innerHTML = editFormHtml({ id: btn.dataset.id, body: bodyEl.textContent });
        bodyEl.after(holder.firstElementChild);
        const form = row.querySelector('.edit-form');
        form.querySelector('.cancel-edit').addEventListener('click', () => { form.remove(); bodyEl.style.display = ''; });
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const val = form.querySelector('input').value;
          if (!val.trim()) return;
          try {
            await Meow.api(`/api/meowments/${btn.dataset.id}`, { method: 'PATCH', body: { body: val } });
            refreshFn();
          } catch (err) { Meow.toast(err.message); }
        });
      });
    });

    container.querySelectorAll('.delete-mm-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this Meowment?')) return;
        try {
          await Meow.api(`/api/meowments/${btn.dataset.id}`, { method: 'DELETE' });
          refreshFn();
        } catch (err) { Meow.toast(err.message); }
      });
    });
  }

  function renderThread(card, meow, meowments) {
    const itemsEl = card.querySelector('.meowments-items');
    itemsEl.innerHTML = meowments.length
      ? meowments.map(mm => commentHtml(mm, meow, 0)).join('')
      : `<p style="font-size:13px; opacity:.6;">No Meowments yet — be the first.</p>`;
    attachThreadHandlers(itemsEl, meow, () => refreshThread(card, meow));
  }

  async function refreshThread(card, meow) {
    const { meowments } = await Meow.api(`/api/meows/${meow.id}/meowments`);
    renderThread(card, meow, meowments);
    const flatCount = countAll(meowments);
    card.querySelector('.mm-count').textContent = flatCount;
  }

  function countAll(nodes) {
    return nodes.reduce((sum, n) => sum + 1 + countAll(n.replies || []), 0);
  }

  function attachCardHandlers(card, meow) {
    Meow.attachReactionBar(card, meow.id);

    const mmToggle = card.querySelector('.meowment-toggle');
    const mmList = card.querySelector('.meowments-list');
    let loaded = false;
    mmToggle.addEventListener('click', async () => {
      const showing = mmList.style.display !== 'none';
      mmList.style.display = showing ? 'none' : 'block';
      if (!showing && !loaded) {
        loaded = true;
        await refreshThread(card, meow);
      }
    });

    const gifToggleBtn = card.querySelector('.gif-toggle-btn');
    const gifInput = card.querySelector('.mm-gif-input');
    gifToggleBtn.addEventListener('click', () => {
      gifInput.style.display = gifInput.style.display === 'none' ? 'block' : 'none';
      if (gifInput.style.display === 'block') gifInput.focus();
    });

    card.querySelector('.meowment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = card.querySelector('.mm-input');
      const gifUrl = gifInput.value.trim();
      if (!input.value.trim() && !gifUrl) return;
      try {
        await Meow.api(`/api/meows/${meow.id}/meowments`, {
          method: 'POST',
          body: { body: input.value, gif_url: gifUrl || undefined },
        });
        input.value = '';
        gifInput.value = '';
        gifInput.style.display = 'none';
        await refreshThread(card, meow);
      } catch (err) { Meow.toast(err.message); }
    });

    const del = card.querySelector('.delete-btn');
    if (del) {
      del.addEventListener('click', async () => {
        if (!confirm('Delete this Meow?')) return;
        try {
          await Meow.api(`/api/meows/${meow.id}`, { method: 'DELETE' });
          card.remove();
        } catch (err) { Meow.toast(err.message); }
      });
    }
  }

  function renderEmptyState() {
    document.getElementById('feed-empty').innerHTML = `
      <div class="card empty-state">
        <div class="emoji">📦😴</div>
        <h3 class="cute">No Meows yet</h3>
        <p>It's quiet in here — like a cat curled up in an empty box. Your cat could be our very first featured superstar.</p>
      </div>
    `;
  }

  async function loadFeed(initial = true) {
    try {
      const url = oldestTimestamp ? `/api/feed?before=${encodeURIComponent(oldestTimestamp)}` : '/api/feed';
      const { feed, empty } = await Meow.api(url);
      document.getElementById('feed-skeleton').style.display = 'none';
      const listEl = document.getElementById('feed-list');
      if (initial && empty) { renderEmptyState(); document.getElementById('load-more').style.display = 'none'; return; }
      document.getElementById('feed-empty').innerHTML = '';
      feed.forEach(m => {
        listEl.insertAdjacentHTML('beforeend', meowCardHtml(m));
        attachCardHandlers(listEl.lastElementChild, m);
      });
      if (feed.length) oldestTimestamp = feed[feed.length - 1].created_at;
      document.getElementById('load-more').style.display = feed.length === 20 ? 'block' : 'none';
    } catch (err) {
      document.getElementById('feed-skeleton').style.display = 'none';
      Meow.toast(err.message);
      if (initial) document.getElementById('feed-empty').innerHTML = Meow.offlineCardHtml('Reload feed');
    }
  }

  async function loadMyCats() {
    const { cats } = await Meow.api(`/api/cats?owner=${Meow.user.id}`);
    const select = document.getElementById('cat-select');
    cats.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id; opt.textContent = `${c.avatar_emoji} ${c.name}`;
      select.appendChild(opt);
    });
  }

  // ---- Composer image uploader ----
  let composerImageUrl = '';
  document.querySelector('.composer-uploader-slot').innerHTML = Meow.uploaderHtml({ label: 'Add a cat photo (optional)', id: 'composer-uploader' });
  const composerUploader = Meow.initUploader(document.getElementById('composer-uploader'), {
    type: 'post',
    onUploaded: (url) => { composerImageUrl = url; },
    onCleared: () => { composerImageUrl = ''; },
  });

  document.getElementById('post-btn').addEventListener('click', async () => {
    const caption = document.getElementById('caption').value;
    const image_url = composerImageUrl;
    const cat_id = document.getElementById('cat-select').value || null;
    const errBox = document.getElementById('composer-error');
    errBox.innerHTML = '';
    if (!caption.trim() && !image_url) {
      errBox.innerHTML = `<div class="error-msg">A Meow needs a caption or an image.</div>`;
      return;
    }
    const btn = document.getElementById('post-btn');
    btn.disabled = true; btn.textContent = 'Posting…';
    try {
      const { meow } = await Meow.api('/api/meows', { method: 'POST', body: { caption, image_url, cat_id } });
      document.getElementById('feed-empty').innerHTML = '';
      const listEl = document.getElementById('feed-list');
      listEl.insertAdjacentHTML('afterbegin', meowCardHtml(meow));
      attachCardHandlers(listEl.firstElementChild, meow);
      document.getElementById('caption').value = '';
      composerImageUrl = '';
      composerUploader.reset();
      Meow.toast('Meow posted! +5 Meowment Points');
    } catch (err) {
      errBox.innerHTML = `<div class="error-msg">${Meow.escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false; btn.textContent = 'Post Meow';
    }
  });

  document.getElementById('load-more').addEventListener('click', () => loadFeed(false));

  document.getElementById('composer-avatar').innerHTML = Meow.avatarHtml(Meow.user);
  loadMyCats();
  loadFeed();
</script>
</body>
</html>
