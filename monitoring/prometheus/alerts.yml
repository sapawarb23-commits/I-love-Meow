groups:
  - name: ilovemeow
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(ilovemeow_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(ilovemeow_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "I Love Meow: >5% of requests are 5xx"
          description: "Error rate has been above 5% for 5 minutes. Check app logs and /health/ready."

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(ilovemeow_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "I Love Meow: p95 latency above 1s"
          description: "95th percentile request latency has exceeded 1 second for 10 minutes."

      - alert: AppDown
        expr: up{job="ilovemeow_app"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "I Love Meow: app target is down"
          description: "Prometheus can't scrape the app's /metrics endpoint — it may be crashed or unresponsive."

      - alert: HighMemoryUsage
        expr: ilovemeow_process_resident_memory_bytes > 450 * 1024 * 1024
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "I Love Meow: memory usage approaching container limit"
          description: "RSS is above 450MB, close to the 512MB limit set in docker-compose.yml. Check for a leak or scale up."
