global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    app: ilovemeow

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ilovemeow_app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [] # wire in an Alertmanager instance if you want paging (PagerDuty/Opsgenie/Slack webhook)
