# Modern TLS config (Mozilla "Intermediate" profile as of 2026) — balances
# strong security with support for clients a few years old. Re-check
# https://ssl-config.mozilla.org/ periodically; TLS best practice shifts.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_timeout 1d;
ssl_session_cache shared:SSL:10m;
ssl_session_tickets off;

# OCSP stapling
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout 5s;

# HSTS is also set at the app layer (security.js) for defense in depth;
# setting it here too means it applies even to nginx-served static assets
# and error pages that never reach Node.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
