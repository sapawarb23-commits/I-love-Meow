user  nginx;
worker_processes auto;
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,'
    '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time",'
    '"referer":"$http_referer","user_agent":"$http_user_agent",'
    '"host":"$host"}';

  access_log /var/log/nginx/access.log main_json;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 2048;
  server_tokens off; # don't advertise nginx version to attackers

  client_max_body_size 6m; # matches server.js's 5MB request-body cap + headroom

  # ---------- gzip ----------
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types
    text/plain text/css text/xml application/json application/javascript
    application/xml application/xml+rss text/javascript image/svg+xml;

  # ---------- rate limiting zones ----------
  # Coarse, IP-based, first line of defense in front of Node's own
  # Redis-backed limiter (rateLimit.js) and auth.js's per-endpoint throttle.
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # ---------- upstream ----------
  upstream ilovemeow_app {
    server app:3000;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
